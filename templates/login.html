<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(-45deg, #0f0f0f, #000428, #004e92, #000000);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes slideIn3D {
      0% {
        transform: rotateY(90deg) translateZ(-200px);
        opacity: 0;
      }
      100% {
        transform: rotateY(0deg) translateZ(0);
        opacity: 1;
      }
    }

    .animate-3d-entry {
      animation: slideIn3D 1s ease-out forwards;
    }

    @keyframes rotateBlobs {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .blob {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 500px;
      height: 500px;
      background: rgba(0, 123, 255, 0.05);
      border-radius: 50%;
      animation: rotateBlobs 30s infinite linear;
      pointer-events: none;
      filter: blur(100px);
      opacity: 0.3;
    }

    .blob2 {
      top: 30%;
      left: 30%;
      width: 600px;
      height: 600px;
      background: rgba(0, 123, 255, 0.05);
      animation: rotateBlobs 35s infinite linear;
    }

    .blob3 {
      top: 60%;
      left: 50%;
      width: 400px;
      height: 400px;
      background: rgba(0, 123, 255, 0.05);
      animation: rotateBlobs 40s infinite linear;
    }
  </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen px-4 relative">

  <!-- Rotating Blobs -->
  <div class="blob"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="w-full max-w-md bg-gray-900 border border-blue-500 rounded-2xl backdrop-blur-md shadow-blue-500/50 shadow-lg p-8 animate-3d-entry z-10">
    <h2 class="text-3xl font-extrabold text-center text-blue-400 mb-6">Log In</h2>

    <!-- Email/Password Form -->
    <form id="loginForm" class="space-y-4">
      <input type="email" id="email" placeholder="Email"
        class="w-full px-4 py-3 bg-gray-800 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 outline-none transition" required />

      <div class="relative">
        <input type="password" id="password" placeholder="Password"
          class="w-full px-4 py-3 pr-12 bg-gray-800 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 outline-none transition" required />
        <button type="button" onclick="togglePassword()" class="absolute top-1/2 right-3 -translate-y-1/2 text-gray-400 hover:text-white">
          <i id="toggleIcon" class="fas fa-eye"></i>
        </button>
      </div>

      <div class="flex items-center justify-between text-sm text-gray-400">
        <label class="flex items-center gap-2">
          <input type="checkbox" id="remember" class="accent-blue-500">
          Remember me
        </label>
        <a href="#" class="hover:underline text-blue-400">Forgot password?</a>
      </div>

      <button type="submit"
        class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg font-semibold shadow-md hover:scale-105 transition">
        Log In
      </button>
    </form>

    <p class="text-center mt-6 text-sm text-gray-400">
      Don't have an account?
      <a href="/signup" class="text-blue-400 hover:underline">Sign up</a>
    </p>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  console.log('Email:', email, 'Password:', password); // Log the email and password

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(data.message);
      // Redirect to the dashboard after successful login
      window.location.href = '/home';
    } else {
      alert(data.message); // Display error message
    }
  })
  .catch(err => {
    console.error('Error:', err); // Log any errors
    alert("An error occurred while logging in. Please try again.");
  });
});
  </script>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
