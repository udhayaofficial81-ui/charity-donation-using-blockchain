<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homepage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      background: linear-gradient(-45deg, #0f0f0f, #000428, #004e92, #000000);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      min-height: 100vh;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .fade-in-up {
      animation: fadeInUp 1.2s ease-out forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .blob-animated {
      position: absolute;
      width: 400px;
      height: 400px;
      z-index: 0;
      opacity: 0.1;
    }

    .pulse-button {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(0, 183, 255, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .pulse-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(0, 183, 255, 0.8);
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(0, 183, 255, 0.4); }
      50% { box-shadow: 0 0 25px rgba(0, 183, 255, 0.8); transform: scale(1.05); }
      100% { box-shadow: 0 0 15px rgba(0, 183, 255, 0.4); }
    }
  </style>
</head>
<body class="relative text-white overflow-x-hidden transition-colors duration-300 dark:bg-black">

  <!-- Navbar -->
  <header class="fixed top-0 w-full z-50 bg-black/30 backdrop-blur-md border-b border-white/10 text-white px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold text-blue-300">Welcome</h1>
    <button id="modeToggle" class="hover:text-yellow-400 transition text-lg">🌓</button>
  </header>

  <!-- Animated SVGs -->
  <svg class="blob-animated top-[-100px] left-[-100px]" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="#3B82F6" d="M48.8,-58.1C60.4,-45.7,65.6,-28.5,66.5,-12.6C67.3,3.3,63.8,18,56.7,31.1C49.7,44.2,39.1,55.7,26.2,61.3C13.3,66.9,-2,66.5,-17.6,61.2C-33.2,55.9,-49,45.7,-59.2,31.5C-69.3,17.2,-73.9,-1.1,-67.6,-16.3C-61.4,-31.4,-44.3,-43.3,-28.2,-54.2C-12.2,-65,-6.1,-74.9,6.3,-81.5C18.7,-88.1,37.4,-91.4,48.8,-58.1Z" transform="translate(100 100)" />
  </svg>

  <svg class="blob-animated bottom-[-100px] right-[-100px]" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="#EC4899" d="M51.1,-63.6C65.6,-55.3,76.5,-37.4,74.6,-21.3C72.8,-5.2,58.2,9.1,48.5,24.2C38.8,39.3,34.1,55.2,23.4,64.5C12.7,73.8,-4,76.6,-17.3,70.3C-30.6,64.1,-40.6,48.9,-52.7,35.6C-64.9,22.4,-79.2,11.2,-80.6,-1.1C-81.9,-13.4,-70.3,-26.7,-59.7,-37.2C-49.1,-47.6,-39.5,-55.2,-27.8,-63.5C-16.2,-71.8,-8.1,-80.8,5.3,-89C18.8,-97.1,37.6,-104.5,51.1,-63.6Z" transform="translate(100 100)" />
  </svg>

  <!-- Hero Section -->
  <main class="pt-32 px-6 fade-in-up">
    <div class="max-w-4xl mx-auto bg-white/5 backdrop-blur-md rounded-2xl p-10 shadow-xl border border-white/10 text-center">
      <h2 class="text-4xl sm:text-5xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 text-transparent bg-clip-text mb-6">
     Charity Donation powered by Blockchain
      </h2>
      <p class="text-lg text-gray-200 mb-4">Revolutionizing how we track donations using blockchain technology.</p>
      <p class="text-lg text-gray-300 mb-4">Every contribution is transparent and traceable on a decentralized ledger.</p>
      <p class="text-lg text-gray-300 mb-6">Build trust and amplify your impact with verifiable giving.</p>

      <a href="/dashboard" class="pulse-button inline-block mt-6">🚀 Get Started</a>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById("modeToggle");
    toggleBtn.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
    });
  </script>

</body>
</html>
